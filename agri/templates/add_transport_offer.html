{% extends 'base.html' %}

{% block title %}Add Transport Offer - AgriPool{% endblock %}

{% block content %}
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white rounded-lg shadow-lg p-8" data-aos="fade-up">
        <h1 class="text-3xl font-bold mb-6">Post Transport Offer</h1>
        
        <form method="POST" action="{% url 'add_transport_offer' %}" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">From Location</label>
                <input type="text" name="from_location" id="from_location" required 
                       placeholder="e.g., Pune"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                <p class="text-xs text-gray-500 mt-1">Type city or village name</p>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">To Location</label>
                <input type="text" name="to_location" id="to_location" required 
                       placeholder="e.g., Mumbai"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                <p class="text-xs text-gray-500 mt-1">Type destination city or market name</p>
            </div>
            
            <!-- Route Preview Map -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Route Preview
                    <span class="text-gray-500 text-xs">(Visual reference only)</span>
                </label>
                <div id="route_map" class="w-full h-64 rounded-lg border border-gray-300"></div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Available Capacity (kg)</label>
                <input type="number" step="0.01" name="capacity_kg" required 
                       placeholder="e.g., 5000"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Price per kg (₹)</label>
                <input type="number" step="0.01" name="price_per_kg" required 
                       placeholder="e.g., 5.50"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Available Date</label>
                <input type="datetime-local" name="available_date" required 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="flex space-x-4">
                <button type="submit" 
                        class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                    Post Offer
                </button>
                <a href="{% url 'transporter_dashboard' %}" 
                   class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300 transition text-center">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    // Initialize map centered on India
    var routeMap = L.map('route_map').setView([20.5937, 78.9629], 5);
    
    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19
    }).addTo(routeMap);
    
    var fromMarker = null;
    var toMarker = null;
    var routeLine = null;
    
    // Function to geocode location
    function geocodeLocation(locationName, callback) {
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(locationName)}, India`)
            .then(response => response.json())
            .then(data => {
                if (data && data.length > 0) {
                    callback({
                        lat: parseFloat(data[0].lat),
                        lon: parseFloat(data[0].lon),
                        name: data[0].display_name
                    });
                }
            })
            .catch(err => console.log('Geocoding error:', err));
    }
    
    // Update map when locations are entered
    function updateRouteMap() {
        var fromLoc = document.getElementById('from_location').value;
        var toLoc = document.getElementById('to_location').value;
        
        if (fromLoc && toLoc) {
            // Clear existing markers and lines
            if (fromMarker) routeMap.removeLayer(fromMarker);
            if (toMarker) routeMap.removeLayer(toMarker);
            if (routeLine) routeMap.removeLayer(routeLine);
            
            // Geocode from location
            geocodeLocation(fromLoc, function(fromData) {
                fromMarker = L.marker([fromData.lat, fromData.lon])
                    .addTo(routeMap)
                    .bindPopup('<b>From:</b> ' + fromLoc);
                
                // Geocode to location
                geocodeLocation(toLoc, function(toData) {
                    toMarker = L.marker([toData.lat, toData.lon])
                        .addTo(routeMap)
                        .bindPopup('<b>To:</b> ' + toLoc);
                    
                    // Draw line between locations
                    routeLine = L.polyline([
                        [fromData.lat, fromData.lon],
                        [toData.lat, toData.lon]
                    ], {
                        color: 'blue',
                        weight: 3,
                        opacity: 0.7
                    }).addTo(routeMap);
                    
                    // Fit map to show both markers
                    var bounds = L.latLngBounds([
                        [fromData.lat, fromData.lon],
                        [toData.lat, toData.lon]
                    ]);
                    routeMap.fitBounds(bounds, { padding: [50, 50] });
                });
            });
        }
    }
    
    // Add event listeners with debounce
    var timeout;
    document.getElementById('from_location').addEventListener('input', function() {
        clearTimeout(timeout);
        timeout = setTimeout(updateRouteMap, 1000);
    });
    
    document.getElementById('to_location').addEventListener('input', function() {
        clearTimeout(timeout);
        timeout = setTimeout(updateRouteMap, 1000);
    });
</script>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Login - AgriPool{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-lg" data-aos="fade-up">
        <div>
            <h2 class="text-center text-3xl font-bold text-gray-900">Sign in to AgriPool</h2>
            <p class="mt-2 text-center text-sm text-gray-600">Choose your account type</p>
        </div>
        
        <div x-data="{ userType: 'farmer' }" class="space-y-6">
            <!-- User Type Selection -->
            <div class="flex space-x-4">
                <button @click="userType = 'farmer'" 
                        :class="userType === 'farmer' ? 'bg-green-600 text-white' : 'bg-gray-200 text-gray-700'"
                        class="flex-1 py-2 px-4 rounded-lg font-medium transition">
                    🌾 Farmer
                </button>
                <button @click="userType = 'transporter'" 
                        :class="userType === 'transporter' ? 'bg-green-600 text-white' : 'bg-gray-200 text-gray-700'"
                        class="flex-1 py-2 px-4 rounded-lg font-medium transition">
                    🚚 Transporter
                </button>
            </div>

            <form method="POST" action="{% url 'login' %}" class="space-y-4">
                {% csrf_token %}
                <input type="hidden" name="user_type" x-model="userType">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                    <input type="text" name="username" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" name="password" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent">
                </div>

                {% if error %}
                <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                    {{ error }}
                </div>
                {% endif %}

                <button type="submit" 
                        class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition">
                    Sign In
                </button>
            </form>

            <div class="text-center">
                <p class="text-sm text-gray-600">
                    Don't have an account? 
                    <a href="{% url 'register' %}" class="text-green-600 hover:text-green-700 font-medium">Register here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

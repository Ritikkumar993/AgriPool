version: '3.8'
services:
  web:
    build: .
    container_name: agripool_web
    command: gunicorn agripool.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - '8000:8000'
    depends_on:
      - mongo
    environment:
      - DJANGO_SETTINGS_MODULE=agripool.settings
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DBNAME=agripool
  mongo:
    image: mongo:6.0
    container_name: agripool_mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
  mongo-express:
    image: mongo-express:1.0.0
    restart: always
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    ports:
      - '8081:8081'
volumes:
  mongo_data:
